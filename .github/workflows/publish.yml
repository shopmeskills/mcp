name: Publish to npm

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Publish logistics-tracking-mcp
        run: npm publish --access public
        working-directory: packages/logistics-tracking-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish cn-ecommerce-search-mcp
        run: npm publish --access public
        working-directory: packages/cn-ecommerce-search-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish visual-product-search-mcp
        run: npm publish --access public
        working-directory: packages/visual-product-search-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish xiaohongshu-data-mcp
        run: npm publish --access public
        working-directory: packages/xiaohongshu-data-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish cross-border-price-compare-mcp
        run: npm publish --access public
        working-directory: packages/cross-border-price-compare-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish product-recommendation-mcp
        run: npm publish --access public
        working-directory: packages/product-recommendation-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  sync-clawhub:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clawdhub CLI
        run: npm i -g clawdhub

      - name: Sync skills to ClawHub
        run: |
          for skill_dir in skills/*/; do
            echo "Syncing $(basename $skill_dir)..."
            cd "$skill_dir"
            clawdhub sync || echo "Failed to sync $(basename $skill_dir)"
            cd - > /dev/null
          done
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        continue-on-error: true
